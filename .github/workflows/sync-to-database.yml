name: Sync to Database on Merge

on:
  push:
    branches:
      - main
    paths:
      - 'data/passport-requirements/*.json'
      - 'data/document-privileges/*.json'

jobs:
  sync-to-supabase:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      pull-requests: write
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Get changed files
        id: changed
        run: |
          CHANGED_FILES=$(git diff --name-only HEAD~1 HEAD | grep -E '^data/(passport-requirements|document-privileges)/.*\.json$' || true)
          echo "files<<EOF" >> $GITHUB_OUTPUT
          echo "$CHANGED_FILES" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
          echo "Found changed files: $CHANGED_FILES"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Sync passport requirements directly to Supabase
        if: steps.changed.outputs.files != ''
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          CHANGED_FILES: ${{ steps.changed.outputs.files }}
        run: |
          echo "Syncing verified data directly to Supabase..."
          
          FAILED=0
          
          # One changed file per line (a merge can change several files)
          while IFS= read -r file; do
            if [[ "$file" == data/passport-requirements/*.json ]]; then
              COUNTRY_CODE=$(basename "$file" .json)
              echo "Syncing passport requirements for: $COUNTRY_CODE"
              
              # Read the JSON and sync via Node.js script
              if ! SYNC_FILE="$file" SYNC_COUNTRY="$COUNTRY_CODE" node -e "
                const fs = require('fs');
                const data = JSON.parse(fs.readFileSync(process.env.SYNC_FILE, 'utf8'));
                
                async function syncToSupabase() {
                  const supabaseUrl = process.env.SUPABASE_URL;
                  const supabaseKey = process.env.SUPABASE_SERVICE_ROLE_KEY;
                  
                  if (!supabaseUrl || !supabaseKey) {
                    console.error('Missing Supabase credentials');
                    process.exit(1);
                  }
                  
                  const fromCountry = data.passport?.code || process.env.SYNC_COUNTRY;
                  let successCount = 0;
                  let errorCount = 0;
                  
                  for (const route of data.routes || []) {
                    const record = {
                      from_country: fromCountry,
                      to_country: route.to?.code,
                      region: route.region || 'unknown',
                      popular_for: route.popularFor || [],
                      visa_info: {
                        visa_required: route.visa?.required,
                        visa_policy: ({ visa_on_arrival: 'voa' })[route.visa?.policy] || route.visa?.policy,
                        visa_type_hint: route.visa?.type || null,
                        visa_free_days: route.visa?.freeDays || null,
                        evisa_available: route.visa?.evisa || false,
                        visa_on_arrival: route.visa?.onArrival || false,
                        allowed_stay_days: route.visa?.maxStay || null,
                        multiple_entry_possible: route.visa?.multipleEntry || null,
                        cost: route.visa?.cost || null,
                        processing_days: route.visa?.processingDays || null,
                        notes: route.visa?.notes || null
                      },
                      transit_info: route.transit || {},
                      document_requirements: {
                        passport_min_validity_months: route.documents?.passport?.minimumValidityMonths || 6,
                        blank_pages_required: route.documents?.passport?.blankPagesRequired || 2,
                        onward_ticket_required: route.documents?.requirements?.onwardTicket || false,
                        proof_of_funds_required: route.documents?.requirements?.proofOfFunds || false,
                        hotel_or_address_required: route.documents?.requirements?.accommodation || false,
                        travel_insurance_recommended: route.documents?.requirements?.travelInsurance?.recommended || false,
                        travel_insurance_mandatory: route.documents?.requirements?.travelInsurance?.mandatory || false,
                        yellow_fever_required_if_travelling_from_endemic_zone: route.documents?.requirements?.yellowFeverCertificate || false,
                        extra_requirements_notes: route.documents?.notes || null
                      },
                      meta_info: {
                        risk_level: route.meta?.riskLevel || 'medium',
                        last_checked: new Date().toISOString(),
                        checked_source: route.source?.url || 'github-contribution',
                        confidence: 'verified'
                      },
                      updated_at: new Date().toISOString()
                    };
                    
                    try {
                      const response = await fetch(
                        supabaseUrl + '/rest/v1/VisaRequirements?from_country=eq.' + fromCountry + '&to_country=eq.' + route.to?.code,
                        {
                          method: 'GET',
                          headers: {
                            'apikey': supabaseKey,
                            'Authorization': 'Bearer ' + supabaseKey
                          }
                        }
                      );
                      
                      const existing = await response.json();
                      const method = existing.length > 0 ? 'PATCH' : 'POST';
                      const url = existing.length > 0 
                        ? supabaseUrl + '/rest/v1/VisaRequirements?from_country=eq.' + fromCountry + '&to_country=eq.' + route.to?.code
                        : supabaseUrl + '/rest/v1/VisaRequirements';
                      
                      const upsertResponse = await fetch(url, {
                        method: method,
                        headers: {
                          'apikey': supabaseKey,
                          'Authorization': 'Bearer ' + supabaseKey,
                          'Content-Type': 'application/json',
                          'Prefer': 'return=minimal'
                        },
                        body: JSON.stringify(method === 'POST' ? record : {
                          ...record,
                          updated_at: new Date().toISOString()
                        })
                      });
                      
                      if (upsertResponse.ok || upsertResponse.status === 201 || upsertResponse.status === 204) {
                        successCount++;
                      } else {
                        const error = await upsertResponse.text();
                        console.error('Failed: ' + fromCountry + ' → ' + route.to?.code + ': ' + error);
                        errorCount++;
                      }
                    } catch (e) {
                      console.error('Error: ' + fromCountry + ' → ' + route.to?.code + ': ' + e.message);
                      errorCount++;
                    }
                  }
                  
                  console.log('✅ Synced ' + successCount + ' routes, ❌ ' + errorCount + ' errors for ' + fromCountry);
                  if (errorCount > 0) {
                    console.error('Sync failed for ' + errorCount + ' route(s)');
                    process.exit(1);
                  }
                }
                
                syncToSupabase().catch(e => { console.error(e); process.exit(1); });
              "; then
                FAILED=1
              fi
            elif [[ "$file" == data/document-privileges/*.json ]]; then
              DOC_NAME=$(basename "$file" .json)
              echo "Syncing document privileges for: $DOC_NAME"
              
              if ! SYNC_FILE="$file" SYNC_DOC="$DOC_NAME" node -e "
                const fs = require('fs');
                const data = JSON.parse(fs.readFileSync(process.env.SYNC_FILE, 'utf8'));
                
                async function syncPrivileges() {
                  const supabaseUrl = process.env.SUPABASE_URL;
                  const supabaseKey = process.env.SUPABASE_SERVICE_ROLE_KEY;
                  
                  if (!supabaseUrl || !supabaseKey) {
                    console.error('Missing Supabase credentials');
                    process.exit(1);
                  }
                  
                  const doc = data.document || {};
                  const docType = doc.type;
                  const AREA_CODES = { SCHENGEN: 'EU' };
                  const issuing = AREA_CODES[doc.country] || doc.country;
                  if (!docType || !issuing) {
                    console.error('File has no document.type or document.country, cannot sync');
                    process.exit(1);
                  }
                  if (issuing.length > 2) {
                    console.error('Issuing code ' + issuing + ' is not a 2-letter code and has no mapping in AREA_CODES');
                    process.exit(1);
                  }
                  
                  let successCount = 0;
                  let errorCount = 0;
                  
                  for (const u of (data.unlocks || [])) {
                    if (!u.country) { continue; }
                    
                    const record = {
                      document_type: docType,
                      issuing_country: issuing,
                      issuing_country_name: doc.countryName || null,
                      document_category: (doc.categories && doc.categories[0]) || null,
                      destination_country: u.country,
                      destination_name: u.countryName || null,
                      destination_region: u.region || null,
                      access_type: u.visaOnArrival ? 'voa' : (u.evisaRequired ? 'evisa' : 'visa_free'),
                      max_stay_days: (u.maxStayDays == null ? null : u.maxStayDays),
                      conditions: u.conditions || null,
                      e_visa_required: !!u.evisaRequired,
                      notes: u.notes || null,
                      source_url: (u.source && u.source.url) || null,
                      source_accessed_date: (u.source && u.source.accessedDate) || null,
                      confidence: (u.source && u.source.confidence) || null,
                      updated_at: new Date().toISOString()
                    };
                    
                    const query = supabaseUrl + '/rest/v1/DocumentPrivileges?document_type=eq.' + docType + '&issuing_country=eq.' + issuing + '&destination_country=eq.' + u.country;
                    
                    try {
                      const response = await fetch(query, {
                        method: 'GET',
                        headers: {
                          'apikey': supabaseKey,
                          'Authorization': 'Bearer ' + supabaseKey
                        }
                      });
                      
                      const existing = await response.json();
                      const method = existing.length > 0 ? 'PATCH' : 'POST';
                      const url = existing.length > 0 ? query : supabaseUrl + '/rest/v1/DocumentPrivileges';
                      
                      const upsertResponse = await fetch(url, {
                        method: method,
                        headers: {
                          'apikey': supabaseKey,
                          'Authorization': 'Bearer ' + supabaseKey,
                          'Content-Type': 'application/json',
                          'Prefer': 'return=minimal'
                        },
                        body: JSON.stringify(record)
                      });
                      
                      if (upsertResponse.ok) {
                        successCount++;
                      } else {
                        const error = await upsertResponse.text();
                        console.error('Failed: ' + issuing + ' ' + docType + ' -> ' + u.country + ': ' + error.slice(0, 200));
                        errorCount++;
                      }
                    } catch (e) {
                      console.error('Error: ' + issuing + ' ' + docType + ' -> ' + u.country + ': ' + e.message);
                      errorCount++;
                    }
                  }
                  
                  console.log('Synced ' + successCount + ' privilege entries, ' + errorCount + ' errors for ' + process.env.SYNC_DOC);
                  if (errorCount > 0) {
                    console.error('Sync failed for ' + errorCount + ' entries');
                    process.exit(1);
                  }
                }
                
                syncPrivileges().catch(e => { console.error(e); process.exit(1); });
              "; then
                FAILED=1
              fi
            fi
          done <<< "$CHANGED_FILES"
          
          if [ "$FAILED" -ne 0 ]; then
            echo "::error::Sync failed for at least one file"
            exit 1
          fi
          
          echo "Sync complete!"

      - name: Post sync summary
        if: steps.changed.outputs.files != ''
        continue-on-error: true
        uses: actions/github-script@v7
        with:
          script: |
            const changedFiles = `${{ steps.changed.outputs.files }}`.split('\n').filter(f => f);
            
            const body = `
            ## 🔄 Database Sync Complete
            
            The following verified data has been synced to the production database:
            
            | File | Status |
            |------|--------|
            ${changedFiles.map(f => `| \`${f}\` | ✅ Synced |`).join('\n')}
            
            **Timestamp:** ${new Date().toISOString()}
            
            ---
            *Automated sync by Diaspora Visa Data CI*
            `;
            
            // Find the merged PR
            const commits = await github.rest.repos.listCommits({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              per_page: 1
            });
            
            const commitMessage = commits.data[0]?.commit?.message || '';
            const prMatch = commitMessage.match(/Merge pull request #(\d+)/);
            
            if (prMatch) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: parseInt(prMatch[1]),
                body: body
              });
            }
